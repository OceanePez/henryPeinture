name: CI-CD Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # ou la version de ton projet

      - name: Install dependencies
        run: npm install

      - name: Lint the code
        run: npm run lint

      - name: Build the project
        run: npm run build

      # Ajoute cette étape si tu as des tests
      - name: Run tests
        run: npm test
